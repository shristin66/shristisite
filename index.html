<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shristi Niroula | Registered Nurse</title>
    <meta
      name="description"
      content="Shristi Niroula, a registered nurse in Kathmandu, Nepal: Nursing Officer at Shahid Gangalal National Heart Centre, licensed in Nepal and the United States." />
    <meta name="author" content="Shristi Niroula" />
    <meta name="theme-color" content="#c9226d" />
    <meta property="og:title" content="Shristi Niroula | Registered Nurse" />
    <meta
      property="og:description"
      content="Shristi Niroula, a registered nurse in Kathmandu, Nepal: Nursing Officer at Shahid Gangalal National Heart Centre, licensed in Nepal and the United States." />
    <meta property="og:type" content="website" />
    <script>
      // Apply the saved theme (light by default) before first paint to avoid a flash.
      (function () {
        try {
          var root = document.documentElement;
          var stored = localStorage.getItem('theme');
          var dark =
            stored === 'dark' ||
            (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          root.classList.add(dark ? 'dark' : 'light');
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
